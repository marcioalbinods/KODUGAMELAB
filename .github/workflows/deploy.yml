name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Testes automatizados (conteúdo, regras, interface)
        run: npm test
      - name: Testes do banco de dados e das regras de segurança (RLS)
        run: npm run test:db

  build-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar a configuração do Supabase (arquivo .env.production)
        run: npx tsx scripts/check-config.ts
      - name: Compilar
        # A configuração pública do Supabase vem do arquivo .env.production.
        # Sem ela, o site é publicado em MODO DEMONSTRAÇÃO.
        run: npm run build
      - name: Verificar que nenhuma chave secreta foi incluída
        run: node scripts/check-secrets.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
